name: local_plant_nurseries_app
description: A Flutter app for local plant nurseries.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  flutter_riverpod: ^2.4.9
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7
  url_launcher: ^6.2.4
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter_timezone: ^1.0.4
  firebase_messaging: ^15.2.10
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plants_data.json
